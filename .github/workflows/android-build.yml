name: Android - build Cindrix Ops (Hub on a phone)

# Builds the complete Hub app for an Android phone (the Note 10): the program, the assistant engine (llama.cpp's
# llama-server built for the phone), and the shipped cards, plans, courses and guides, all inside one APK.
# Runs by hand (Run workflow), and on every push to main or android-hub that touches the program.
# The APK is signed with the sideload key in android/ so a new build installs over the old one (for example with
# Cindrix Deploy). Every run puts the APK on the run page and on a release page for a plain download link.

on:
  workflow_dispatch:
  push:
    branches: [main, android-hub]
    paths:
      - ".github/workflows/android-build.yml"
      - "android/**"
      - "src/**"
      - "src-tauri/**"
      - "core/**"
      - "crypto/**"
      - "content/**"
      - "licenses/**"
      - "package.json"
      - "vite.config.ts"
      - "index.html"
      - "public/**"

permissions:
  contents: write

env:
  # llama.cpp release the engine is built from. Change this one line to move to a newer engine.
  LLAMA_TAG: b12474
  NDK_VERSION: 26.3.11579264

jobs:
  engine:
    name: Assistant engine for the phone (llama-server, arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Reuse the engine if this llama.cpp release was already built
        id: cache
        uses: actions/cache@v4
        with:
          path: engine-out
          key: llama-server-android-arm64-${{ env.LLAMA_TAG }}-v1
      - name: Install the phone compiler (NDK)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build llama-server for the phone
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp llama.cpp
          cd llama.cpp
          # The Note 10 has ARMv8.2 cores with the dot-product instructions. One static program, no OpenMP, no network code.
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod" \
            -DGGML_CPU_ARM_ARCH="armv8.2-a+dotprod" \
            -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          cmake --build build --config Release -j"$(nproc)" --target llama-server
          mkdir -p ../engine-out
          cp build/bin/llama-server ../engine-out/libllama_server.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" ../engine-out/libllama_server.so
      - name: Check the engine is a self-contained phone program
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/${NDK_VERSION}"
          [ -f engine-out/libllama_server.so ] || { echo "::error::no engine was produced"; exit 1; }
          ls -la engine-out
          file engine-out/libllama_server.so | tee file.txt
          grep -q "ARM aarch64" file.txt || { echo "::error::the engine is not an arm64 program"; exit 1; }
          RE="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          [ -x "$RE" ] || RE=readelf
          needed=$("$RE" -d engine-out/libllama_server.so | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/')
          echo "The engine needs these system libraries: $needed"
          for n in $needed; do
            case "$n" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so) ;;
              *) echo "::error::the engine needs $n, which a phone does not have; it must be built self-contained"; exit 1 ;;
            esac
          done
          "$RE" -h engine-out/libllama_server.so | grep -E "Type:" | tee type.txt
          grep -q "DYN" type.txt || { echo "::error::the engine is not a position-independent program, Android will not start it"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: llama-server-android-arm64
          path: engine-out/libllama_server.so

  hub:
    name: Hub app for Android (APK)
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install the Android build tools
        run: |
          # the runner already carries the Android SDK; add the pieces the build wants
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri icon src-tauri/icon.svg
      - name: Core tests (the same logic the phone runs)
        run: "cd core && cargo test --lib -- drive:: engine:: tarpack:: hardware:: modelhost::"
      - name: Make the Android project
        run: npx tauri android init --ci
      - name: Give the app the permissions the Hub needs, keep the screen on, and let it install the engine
        run: |
          python3 - <<'PY'
          import glob, re
          # 1. permissions
          p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          want = [
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.ACCESS_WIFI_STATE",
            "android.permission.CHANGE_WIFI_STATE",
            "android.permission.MANAGE_EXTERNAL_STORAGE",
            "android.permission.READ_EXTERNAL_STORAGE",
            "android.permission.WRITE_EXTERNAL_STORAGE",
            "android.permission.WAKE_LOCK",
          ]
          add = "".join(f'    <uses-permission android:name="{w}" />\n' for w in want if w not in s)
          s = s.replace("<application", add + "    <application", 1)
          if "usesCleartextTraffic" not in s:
            s = s.replace("<application", '<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"', 1)
          open(p, "w").write(s)
          print(s)
          # 2. the engine is a program kept in the app's library folder, so the libraries must be installed as real files
          g = glob.glob("src-tauri/gen/android/app/build.gradle*")[0]
          t = open(g).read()
          if "useLegacyPackaging" not in t:
            t += "\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n"
            open(g, "w").write(t)
          print(open(g).read()[-400:])
          # 3. the Hub phone serves other devices, so keep the screen on while the app is open
          for m in glob.glob("src-tauri/gen/android/app/src/main/java/**/MainActivity.kt", recursive=True):
            src = open(m).read()
            pkg = re.search(r"^package\s+(\S+)", src, re.M).group(1)
            open(m, "w").write(open("android/MainActivity.kt.tmpl").read().replace("PACKAGE_NAME", pkg))
            print("patched", m)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: llama-server-android-arm64
          path: engine
      - name: Put the assistant engine and the shipped content into the app
        run: |
          set -e
          LIBS=src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$LIBS"
          # the engine built by the first job
          cp engine/libllama_server.so "$LIBS/libllama_server.so"
          # the shipped cards, plans, drills, seed guides, courses, guides, sample library and the lists (same set as the Windows build)
          mkdir -p pack/content
          cp content/sources.json content/library-catalog.json pack/content/
          cp content/*.csv pack/content/
          cp -r content/library-sample content/cards content/plans content/seed-guides content/drills content/academy content/guides pack/content/
          [ -d content/images ] && cp -r content/images pack/content/ || true
          tar --format=ustar -czf "$LIBS/libcontent_pack.so" -C pack/content .
          ls -la "$LIBS"
      - name: Build the APK
        run: |
          set +e
          npx tauri android build --apk --target aarch64 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(grep -E -A14 '^(error|FAILURE|\* What went wrong)' build.log | head -90 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code
      - name: Sign the APK with the sideload key
        run: |
          set -e
          unsigned=$(find src-tauri/gen/android -name "*release-unsigned.apk" | head -1)
          [ -n "$unsigned" ] || { echo "::error::no release APK was built"; find src-tauri/gen/android -name "*.apk"; exit 1; }
          echo "found: $unsigned"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$unsigned" aligned.apk
          "$BT/apksigner" sign --ks android/cindrix-hub.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias cindrix --out dist/CindrixOps-Hub-android.apk aligned.apk
          "$BT/apksigner" verify --verbose dist/CindrixOps-Hub-android.apk | head -8
      - name: Check the APK carries everything the Hub needs
        run: |
          set -e
          APK=dist/CindrixOps-Hub-android.apk
          unzip -l "$APK" | grep -E "lib/arm64-v8a/" | tee libs.txt
          for f in libllama_server.so libcontent_pack.so libcindrix_ops_lib.so; do
            grep -q "lib/arm64-v8a/$f" libs.txt || { echo "::error::the APK has no $f"; exit 1; }
          done
          # the libraries must be installed as real files, or the engine cannot be started
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep -i "extractNativeLibs" manifest.txt | tee ext.txt
          grep -qi "extractNativeLibs.*=true\|extractNativeLibs.*=(type 0x12)0xffffffff" ext.txt || { echo "::error::the app is not set to install its libraries as files"; cat manifest.txt | head -40; exit 1; }
          # the content pack inside the APK unpacks and holds the lists and the cards
          mkdir -p chk && unzip -o -q "$APK" "lib/arm64-v8a/libcontent_pack.so" -d chk
          mkdir -p chk/out && tar -xzf chk/lib/arm64-v8a/libcontent_pack.so -C chk/out
          for f in skills.csv replacements.csv forage-seasons.csv sources.json; do
            [ -f "chk/out/$f" ] || { echo "::error::the content pack has no $f"; exit 1; }
          done
          echo "cards in the pack: $(ls chk/out/cards | wc -l)"
          [ "$(ls chk/out/cards | wc -l)" -gt 100 ] || { echo "::error::the content pack has too few cards"; exit 1; }
          sha256sum "$APK" | tee dist/CindrixOps-Hub-android.sha256
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: CindrixOps-Hub-android
          path: dist/*
      - name: Publish the APK as a release
        # the repository may not let workflows make releases; the APK is still on the run page as an artifact
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hub-android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Cindrix Ops Hub for Android (build ${GITHUB_RUN_NUMBER}, ${GITHUB_REF_NAME})" \
            --notes "Built by CI from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Complete Hub app: program, assistant engine and shipped content in one APK. Not yet run on a real phone by the builder. After installing, allow All files access for the app in Android settings, put a Qwen3.5 .gguf model in the models folder on the drive, then Settings > Assistant > Check the assistant."
