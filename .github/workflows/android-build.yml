name: Android - build Cindrix Ops (Hub on a phone)

# Builds the Android app (the Hub for the Note 10). Run it from the Actions tab (Run workflow).
# The APK is a debug-signed build so it installs by sideloading (for example with Cindrix Deploy).
# It is made fresh each time: the Android project is generated by `tauri android init`, then given the
# permissions the Hub needs. A run started by hand also puts the APK on a release page for a plain download link.

on:
  workflow_dispatch:
  # also runs when this file or the Android code changes on the working branch, so it can be tried before it reaches main
  push:
    branches: [security-docs]
    paths:
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

jobs:
  android:
    name: Android app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install the Android build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri icon src-tauri/icon.svg
      - name: Core tests (the same logic the phone runs)
        run: cd core && cargo test --lib drive
      - name: Make the Android project
        run: npx tauri android init --ci
      - name: Give the app the permissions the Hub needs
        run: |
          python3 - <<'PY'
          import re
          p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          want = [
            "android.permission.INTERNET",
            "android.permission.ACCESS_NETWORK_STATE",
            "android.permission.ACCESS_WIFI_STATE",
            "android.permission.CHANGE_WIFI_STATE",
            "android.permission.MANAGE_EXTERNAL_STORAGE",
            "android.permission.READ_EXTERNAL_STORAGE",
            "android.permission.WRITE_EXTERNAL_STORAGE",
            "android.permission.WAKE_LOCK",
          ]
          add = "".join(f'    <uses-permission android:name="{w}" />\n' for w in want if w not in s)
          s = s.replace("<application", add + "    <application", 1)
          if "usesCleartextTraffic" not in s:
            s = s.replace("<application", '<application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"', 1)
          open(p, "w").write(s)
          print(s)
          PY
      - name: Build the APK
        run: |
          set +e
          npx tauri android build --apk --debug --target aarch64 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            msg=$(grep -E -A14 '^(error|FAILURE|\* What went wrong)' build.log | head -90 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build errors::${msg}"
          fi
          exit $code
      - name: Name the APK
        run: |
          mkdir -p dist
          apk=$(find src-tauri/gen/android -name "*.apk" | head -1)
          echo "found: $apk"
          cp "$apk" dist/CindrixOps-Hub-android.apk
          sha256sum dist/CindrixOps-Hub-android.apk | tee dist/CindrixOps-Hub-android.sha256
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: CindrixOps-Hub-android
          path: dist/*
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="hub-android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "Cindrix Ops Hub for Android (build ${GITHUB_RUN_NUMBER})" \
            --notes "Built by CI from ${GITHUB_SHA::7}. Not yet run on a real phone by the builder. After installing, allow All files access for the app in Android settings."
