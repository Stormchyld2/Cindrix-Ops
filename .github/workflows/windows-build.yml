name: Windows - build Cindrix Ops

# Builds the Windows program with everything it carries (the portable folder and the content pack).
# Run it from the Actions tab (Run workflow), or it runs as part of every push through ci.yml.
# A run started by hand also puts the portable build on a release page as one zip, for a plain download link.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  windows:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri icon src-tauri/icon.svg
      - name: Build the Windows app
        shell: bash
        run: |
          set +e
          npx tauri build --no-bundle 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # show the compiler's complaints as annotations, so they can be read without the full log
            msg=$(grep -E -A14 '^(error|warning: unused)' build.log | head -90 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build errors::${msg}"
            msg2=$(grep -v '^\s*Compiling' build.log | tail -25 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=End of build log::${msg2}"
          fi
          exit $code
      - name: Assemble portable folder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error::failed at step line $LINENO"' ERR
          mkdir -p out/Cindrix
          cp src-tauri/target/release/cindrix-ops.exe out/Cindrix/
          # the program is not code-signed yet: print its SHA-256 so a downloaded copy can be compared (docs/49)
          sha256sum out/Cindrix/cindrix-ops.exe | tee out/cindrix-ops.sha256
          # The program carries its own cards, medical cards, plans, drills, seed guides, courses and guides, so it works with nothing
          # else beside it. Books, manuals, maps, music and .zim files stay on the drive. A drive that has its own content\<name>
          # folder with files in it is read instead of the copy here (content_sub in src-tauri/src/lib.rs).
          mkdir -p out/Cindrix/content && cp content/sources.json out/Cindrix/content/ && cp -r content/library-sample out/Cindrix/content/
          cp -r content/cards content/plans content/seed-guides content/drills content/academy content/guides out/Cindrix/content/
          mkdir -p out/Cindrix/models out/Cindrix/engines
          url=""
          for try in 1 2 3 4 5; do
            url=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=15" --jq '[.[].assets[] | select(.name | test("bin-win-cpu-x64\\.zip$"))][0].browser_download_url' || true)
            if [ -n "$url" ] && [ "$url" != "null" ]; then break; fi
            echo "llama.cpp release list not ready (try $try); waiting"; sleep 20
          done
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "::error::no llama.cpp windows cpu asset found"; exit 1; fi
          echo "llama.cpp: $url"
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o llama.zip "$url"
          powershell -NoProfile -Command "Expand-Archive -Path llama.zip -DestinationPath llama-extract"
          ls llama-extract || true
          cp -r llama-extract/* out/Cindrix/engines/
          mkdir -p out/Cindrix/library
          curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors https://download.kiwix.org/release/kiwix-tools/ -o kt.html || true
          kt=$(grep -oE 'kiwix-tools_win-i686-[0-9.]+\.zip' kt.html | sort -uV | tail -n1 || true)
          if [ -n "$kt" ]; then
            echo "kiwix-tools: $kt"
            curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o kt.zip "https://download.kiwix.org/release/kiwix-tools/$kt"
            powershell -NoProfile -Command "Expand-Archive -Path kt.zip -DestinationPath kt-extract"
            cp -r kt-extract/*/* out/Cindrix/engines/ 2>/dev/null || cp -r kt-extract/* out/Cindrix/engines/
          else
            echo "::warning::kiwix-tools not found; the big library will not work in this build"
          fi
          # ffmpeg (LGPL build) lets the music player play WMA and similar. Optional: the build goes on without it.
          mkdir -p out/Cindrix/music out/Cindrix/LICENSES
          ff=$(gh api "repos/BtbN/FFmpeg-Builds/releases/latest" --jq '[.assets[] | select(.name | test("^ffmpeg-master-latest-win64-lgpl\\.zip$"))][0].browser_download_url' || true)
          if [ -n "$ff" ] && [ "$ff" != "null" ] && curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors -o ffmpeg.zip "$ff"; then
            powershell -NoProfile -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract"
            cp ffmpeg-extract/*/bin/ffmpeg.exe out/Cindrix/engines/ || echo "::warning::ffmpeg.exe not found in the download"
            cp ffmpeg-extract/*/LICENSE.txt out/Cindrix/LICENSES/ffmpeg-LICENSE.txt 2>/dev/null || true
            ./out/Cindrix/engines/ffmpeg.exe -hide_banner -encoders 2>&1 | grep -E "libopus| flac " || echo "::warning::this ffmpeg has no libopus; music will convert to FLAC"
          else
            echo "::warning::ffmpeg not downloaded; WMA music will not play in this build"
          fi
          printf 'Copy your music here (folders like Artist\\Album\\01 - Song.mp3). It is never changed or counted in the size limit.\r\n' > out/Cindrix/music/README.txt
          printf '{ "name": "Cindrix Ops", "edition": "go" }\r\n' > out/Cindrix/cindrix-drive.json
          printf 'Put .zim library files (from Kiwix) in this folder.\r\n' > out/Cindrix/library/README.txt
          if [ ! -f out/Cindrix/engines/llama-server.exe ]; then echo "::error::llama-server.exe missing: $(ls -R out/Cindrix/engines | tr '\n' ' ')"; exit 1; fi
          printf 'Put a Qwen3.5 .gguf model file in this folder (for example a 2B or 4B Q4 file).\r\n' > out/Cindrix/models/README.txt
          printf 'Run cindrix-ops.exe. Needs Microsoft WebView2 (already on Windows 11). Put a model file in the models folder.\r\n' > out/Cindrix/README.txt
      - name: Add the licenses (our texts, plus the license files of the libraries inside the program)
        shell: bash
        run: |
          mkdir -p out/Cindrix/LICENSES
          cp licenses/*.md licenses/*.txt out/Cindrix/LICENSES/
          node scripts/collect-licenses.mjs out/Cindrix/LICENSES/third-party
      - name: Include the drive and map scripts (so a downloaded copy can fetch its own library and maps)
        shell: bash
        run: |
          mkdir -p out/Cindrix/scripts out/Cindrix/manifest
          cp scripts/build-drive.ps1 scripts/get-maps.ps1 scripts/Get-Maps.bat out/Cindrix/scripts/
          cp scripts/get-druglabels.ps1 scripts/Get-DrugLabels.bat out/Cindrix/scripts/
          cp manifest/content.json out/Cindrix/manifest/
      - name: Add a small test map (this also runs the real map download script)
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:RUNNER_TEMP 'mapwork'
          # A small area at zoom 0 to 13: a few MB, enough to see the map viewer draw roads, water and buildings.
          powershell -NoProfile -File scripts\get-maps.ps1 -Target $work -Bbox:'-105.10,39.62,-104.80,39.82' -Name test-area -MaxZoom 13
          if ($LASTEXITCODE -ne 0) { throw "get-maps.ps1 failed (exit $LASTEXITCODE)" }
          Copy-Item -Recurse -Force (Join-Path $work 'maps') 'out\Cindrix\maps'
          Get-ChildItem -Recurse 'out\Cindrix\maps' -File | ForEach-Object { Write-Host ("map file: {0} ({1:N1} MB)" -f $_.FullName, ($_.Length / 1MB)) }
      - name: Add the offline places list (ZIP codes, towns, parks) and the map fonts
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:RUNNER_TEMP 'mapextras'
          powershell -NoProfile -File scripts\get-maps.ps1 -Target $work -PlacesOnly
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::the places list could not be made (exit $LASTEXITCODE)" }
          powershell -NoProfile -File scripts\get-maps.ps1 -Target $work -FontsOnly
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::the map fonts could not be fetched (exit $LASTEXITCODE)" }
          foreach ($d in 'places','fonts') {
            $from = Join-Path $work "maps\$d"
            if (Test-Path $from) { New-Item -ItemType Directory -Force -Path 'out\Cindrix\maps' | Out-Null; Copy-Item -Recurse -Force $from "out\Cindrix\maps\$d"; Write-Host "added maps\$d" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Cindrix-windows-portable
          path: out/Cindrix
      - name: Make the content pack (the folders that go at the top of the drive)
        shell: bash
        run: |
          mkdir -p pack
          cp -r content/cards content/plans content/seed-guides content/drills content/academy content/guides pack/
          printf 'You do not need this for the portable build: it already carries these folders in its content folder. Use it for a drive that runs the program from somewhere else.\r\nCopy these folders (cards, plans, seed-guides, drills, academy, guides) onto the top of your Cindrix drive and choose Merge.\r\nThe program reads them from the drive. Your own additions go in user\\cards, user\\plans, user\\seed-guides, user\\drills, user\\academy and user\\guides (Settings, Your own cards and plans, opens each one).\r\n' > pack/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cindrix-content-pack
          path: pack

      - name: Zip the portable build (one zip, nothing inside a zip)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Compress-Archive -Path 'out\Cindrix' -DestinationPath 'Cindrix-windows-portable.zip' -Force
          Get-FileHash 'Cindrix-windows-portable.zip' -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Cindrix-windows-portable.zip" } | Set-Content 'Cindrix-windows-portable.sha256'

      - name: Put the build on a release page
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="windows-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Cindrix-windows-portable.zip Cindrix-windows-portable.sha256 --prerelease \
            --title "Cindrix Ops for Windows (build ${GITHUB_RUN_NUMBER})" \
            --notes "Portable Windows build from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Not code-signed: Windows may say 'Windows protected your PC' the first time (More info, then Run anyway). Compare the SHA-256 in the .sha256 file with Get-FileHash if you want to check the download."
