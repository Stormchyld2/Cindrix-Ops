name: ci
on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests and safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core (includes tests/safety/dosing.json)
        working-directory: core
        run: cargo test --all-targets

  interface:
    name: Interface type check (UNTESTED in the first commit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  windows:
    name: Windows app build (UNTESTED in the first commit)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri icon src-tauri/icon.svg
      - run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cindrix-ops-windows
          path: src-tauri/target/release/cindrix-ops.exe
