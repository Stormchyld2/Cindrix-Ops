name: ci
on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests and safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ffmpeg (the music tests make real audio files with it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test core (includes tests/safety/dosing.json)
        working-directory: core
        env:
          CINDRIX_REQUIRE_FFMPEG: "1"
        run: |
          cargo test --all-targets 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # say which tests failed in the run's annotations, where it can be read without the full log
            grep -E "^test .* FAILED$|panicked at" test.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            grep -A3 "panicked at" test.log | head -30 | tr '\n' ' ' | sed 's/^/::error::/'; echo
            grep -E "^error(\[|:)" test.log | head -5 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

  crypto:
    name: Passphrase lock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: crypto
        run: cargo test

  interface:
    name: Interface type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check
        shell: bash
        run: |
          set +e
          npm run check > check.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "Error|error" check.txt | head -15 | while IFS= read -r l; do echo "::error::${l}"; done
            tail -5 check.txt | while IFS= read -r l; do echo "::error::tail: ${l}"; done
          fi
          exit $code
      - run: npm run build

  screenshots:
    name: Screenshots of each screen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the built interface
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
      - run: node scripts/shots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Publish screenshots to the 'screenshots' branch
        if: github.ref == 'refs/heads/main'
        run: |
          cp -r shots "$RUNNER_TEMP/shots"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan screenshots
          git rm -rf --quiet .
          git clean -fdxq
          cp -r "$RUNNER_TEMP/shots/." .
          printf '# Screenshots\n\nMade by CI from the latest build of main.\n' > README.md
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f origin screenshots

  zim-check:
    name: Saved-website archive opens in real Kiwix tools
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build a sample archive with the website saver
        working-directory: core
        run: cargo run --example make_zim -- "$RUNNER_TEMP/zim"
      - name: Check it with zimcheck and kiwix-serve
        shell: bash
        run: |
          set +e
          fail=0
          say() { echo "::notice::$1"; }
          bad() { echo "::error::$1"; fail=1; }
          cd "$RUNNER_TEMP"
          curl -fsSL https://download.kiwix.org/release/kiwix-tools/ -o kt.html
          kt=$(grep -oE 'kiwix-tools_linux-x86_64-[0-9.]+\.tar\.gz' kt.html | sort -uV | tail -n1)
          sudo apt-get install -y zim-tools > apt.log 2>&1 || bad "apt could not install zim-tools"
          say "tools: $kt"
          [ -n "$kt" ] && curl -fsSL -o kt.tgz "https://download.kiwix.org/release/kiwix-tools/$kt" && mkdir -p kt && tar xzf kt.tgz -C kt --strip-components=1
          if command -v zimcheck > /dev/null; then
            out=$(zimcheck zim/sample.zim 2>&1); code=$?
            echo "::notice::zimcheck output: $(echo "$out" | grep -v INFO | tr '\n' '|' | head -c 1500)"
            [ $code -ne 0 ] && bad "zimcheck reported problems (exit $code)"
          else
            bad "zimcheck could not be downloaded"
          fi
          if [ -x kt/kiwix-serve ]; then
            kt/kiwix-serve --port 8099 --address 127.0.0.1 zim/sample.zim > serve.log 2>&1 &
            pid=$!
            sleep 4
            cat=$(curl -s "http://127.0.0.1:8099/catalog/v2/entries")
            path=$(echo "$cat" | grep -oE 'href="/content/[^"/]+"' | head -1 | sed -E 's/href="([^"]+)"/\1/')
            say "book path: $path"
            check() {
              code=$(curl -s -o body.txt -w '%{http_code}' "http://127.0.0.1:8099$1")
              if [ "$code" = "200" ] && grep -q "$2" body.txt; then say "ok $1"; else bad "FAILED $1 -> $code (wanted: $2)"; head -c 300 body.txt | while IFS= read -r l; do echo "::notice::$l"; done; fi
            }
            check "$path/example.test/index.html" "Boil water"
            check "$path/example.test/guides/water%20storage.html" "one gallon"
            check "$path/example.test/site.css" "background"
            check "$path/_cindrix/index.html" "All pages"
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099$path/example.test/pic.png")
            [ "$code" = "200" ] && say "ok picture" || bad "picture -> $code"
            sx=$(curl -s "http://127.0.0.1:8099/suggest?content=$(basename "$path")&term=water" | head -c 300)
            say "suggest: $sx"
            kill $pid 2>/dev/null
            # our own reader against the real kiwix-serve, on archives in the layouts real Kiwix files use
            for z in "$GITHUB_WORKSPACE"/core/tests/fixtures/zims/*.zim; do
              if command -v zimcheck > /dev/null; then
                out=$(zimcheck "$z" 2>&1); code=$?
                echo "::notice::zimcheck $(basename $z): exit $code: $(echo "$out" | grep -v INFO | tr '\n' '|' | head -c 600)"
              fi
              kt/kiwix-serve --port 8098 --address 127.0.0.1 "$z" > serve2.log 2>&1 &
              pid2=$!
              sleep 3
              cout=$(cd "$GITHUB_WORKSPACE/core" && cargo run -q --example cross_check -- 8098 "$z" 2>&1); ccode=$?
              { echo "== cross $(basename $z) exit $ccode"; echo "$cout"; echo "-- serve2"; head -20 serve2.log; } >> "$RUNNER_TEMP/zimlog.txt"
              [ $ccode -ne 0 ] && bad "our reader and kiwix-serve disagree on $(basename $z)"
              kill $pid2 2>/dev/null
            done
            kt/kiwix-serve --port 8099 --address 127.0.0.1 zim/sample.zim > serve.log 2>&1 &
            pid=$!
            sleep 3
            pout=$(cd "$GITHUB_WORKSPACE/core" && cargo run -q --example probe_kiwix -- 8099 "Boil water" example.test/index.html 2>&1); pcode=$?
            { echo "== probe exit $pcode"; echo "$pout"; echo "-- serve"; head -20 serve.log; } >> "$RUNNER_TEMP/zimlog.txt"
            [ $pcode -ne 0 ] && bad "the in-app reader's assumptions do not hold against the real kiwix-serve"
            kill $pid 2>/dev/null
            head -20 serve.log | while IFS= read -r l; do echo "::notice::serve: $l"; done
          else
            bad "kiwix-serve could not be downloaded"
          fi
          if [ $fail -ne 0 ]; then sed -n '/== probe/,$p' "$RUNNER_TEMP/zimlog.txt" | tr '\n' '|' | fold -w 1800 | head -6 | while IFS= read -r l || [ -n "$l" ]; do echo "::error::LOG ${l}"; done; fi
          exit $fail
      - name: Keep the detailed log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zim-check-log
          path: ${{ runner.temp }}/zimlog.txt

  search-check:
    name: Assistant search works against real kiwix-serve and real archives
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Get kiwix-serve and the two small real archives used in the first test
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL https://download.kiwix.org/release/kiwix-tools/ -o kt.html
          kt=$(grep -oE 'kiwix-tools_linux-x86_64-[0-9.]+\.tar\.gz' kt.html | sort -uV | tail -n1 || true)
          [ -n "$kt" ] || { echo "::error::no kiwix-tools linux download found"; exit 1; }
          curl -fsSL -o kt.tgz "https://download.kiwix.org/release/kiwix-tools/$kt"
          mkdir -p kt && tar xzf kt.tgz -C kt --strip-components=1
          # the same archives docs/22-real-test.md tells you to download (the drive plan job proves they exist)
          get() {
            curl -fsSL "https://download.kiwix.org/zim/$1/" -o list.html
            f=$(grep -oE "$2[0-9-]+\.zim" list.html | sort -uV | tail -n1 || true)
            if [ -z "$f" ]; then
              echo "::error::no $2*.zim in zim/$1"
              echo "::notice::names seen: $(grep -oE '[A-Za-z0-9._-]+\.zim' list.html | sort -u | head -40 | tr '\n' ' ')"
              exit 1
            fi
            echo "::notice::archive: $1/$f ($kt)"
            curl -fsSL -o "$f" "https://download.kiwix.org/zim/$1/$f"
          }
          get zimit ready.gov_en_all_
          get other wikem_en_all_maxi_
          ls -l *.zim
      - name: Run the assistant's search against them
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          ./kt/kiwix-serve --port 8097 --address 127.0.0.1 ready.gov*.zim wikem*.zim > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8097/catalog/v2/entries > /dev/null && break; sleep 1; done
          cd "$GITHUB_WORKSPACE/core"
          set +e
          cargo run -q --example probe_search -- 8097 \
            "What should I put in an emergency kit?" "How do I prepare for a flood?" "How do I treat a burn?" "What is anaphylaxis?" "How do I purify water by boiling?" \
            > "$RUNNER_TEMP/search-log.txt" 2>&1
          code=$?
          # GitHub shows at most 10 notices per step, so the log goes out as a few long ones (read them in order)
          grep -E "^(===|key words|assistant search|  - |SUMMARY|FAIL|ok|\[.*(full-text|title search|first raw item|suggest raw))" "$RUNNER_TEMP/search-log.txt" | cut -c1-420 | tr '\n' '|' | fold -w 2800 | head -9 | while IFS= read -r l || [ -n "$l" ]; do echo "::notice::LOG ${l}"; done
          echo "probe exit $code"
          exit $code
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-check-log
          path: |
            ${{ runner.temp }}/search-log.txt
            ${{ runner.temp }}/serve.log

  drive-plan:
    name: Drive builder finds every download (dry run)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dry run for each edition (asks the real servers; downloads nothing)
        shell: powershell
        run: |
          $fail = 0
          foreach ($ed in 'go','vault') {
            $out = & powershell -NoProfile -File scripts\build-drive.ps1 -Target "$env:RUNNER_TEMP\$ed" -Edition $ed -DryRun 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            $text = ($out -split "`r?`n" | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }) -join ' | '
            if ($text.Length -gt 3500) { $text = $text.Substring(0, 3500) }
            Write-Host "::notice::plan $ed (exit $code): $text"
            if ($code -ne 0) { Write-Host "::error::drive plan for $ed failed (exit $code): $text"; $fail = 1 }
          }
          # the short list used for a first real test (docs/22-real-test.md)
          $out = & powershell -NoProfile -File scripts\build-drive.ps1 -Target "$env:RUNNER_TEMP\first-test" -Edition go -Only qwen35-2b,fema-guides,wikem -DryRun 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          $text = ($out -split "`r?`n" | Where-Object { $_.Trim() } | ForEach-Object { $_.Trim() }) -join ' | '
          if ($text.Length -gt 3500) { $text = $text.Substring(0, 3500) }
          Write-Host "::notice::plan first-test (exit $code): $text"
          if ($code -ne 0) { Write-Host "::error::first-test plan failed (exit $code): $text"; $fail = 1 }
          exit $fail

  windows:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri icon src-tauri/icon.svg
      - run: npx tauri build --no-bundle
      - name: Assemble portable folder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error::failed at step line $LINENO"' ERR
          mkdir -p out/Cindrix
          cp src-tauri/target/release/cindrix-ops.exe out/Cindrix/
          cp -r content out/Cindrix/content
          mkdir -p out/Cindrix/models out/Cindrix/engines
          url=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=15" --jq '[.[].assets[] | select(.name | test("bin-win-cpu-x64\\.zip$"))][0].browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "::error::no llama.cpp windows cpu asset found"; exit 1; fi
          echo "llama.cpp: $url"
          curl -fsSL -o llama.zip "$url"
          powershell -NoProfile -Command "Expand-Archive -Path llama.zip -DestinationPath llama-extract"
          ls llama-extract || true
          cp -r llama-extract/* out/Cindrix/engines/
          mkdir -p out/Cindrix/library
          curl -fsSL https://download.kiwix.org/release/kiwix-tools/ -o kt.html || true
          kt=$(grep -oE 'kiwix-tools_win-i686-[0-9.]+\.zip' kt.html | sort -uV | tail -n1 || true)
          if [ -n "$kt" ]; then
            echo "kiwix-tools: $kt"
            curl -fsSL -o kt.zip "https://download.kiwix.org/release/kiwix-tools/$kt"
            powershell -NoProfile -Command "Expand-Archive -Path kt.zip -DestinationPath kt-extract"
            cp -r kt-extract/*/* out/Cindrix/engines/ 2>/dev/null || cp -r kt-extract/* out/Cindrix/engines/
          else
            echo "::warning::kiwix-tools not found; the big library will not work in this build"
          fi
          # ffmpeg (LGPL build) lets the music player play WMA and similar. Optional: the build goes on without it.
          mkdir -p out/Cindrix/music out/Cindrix/LICENSES
          ff=$(gh api "repos/BtbN/FFmpeg-Builds/releases/latest" --jq '[.assets[] | select(.name | test("^ffmpeg-master-latest-win64-lgpl\\.zip$"))][0].browser_download_url' || true)
          if [ -n "$ff" ] && [ "$ff" != "null" ] && curl -fsSL -o ffmpeg.zip "$ff"; then
            powershell -NoProfile -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract"
            cp ffmpeg-extract/*/bin/ffmpeg.exe out/Cindrix/engines/ || echo "::warning::ffmpeg.exe not found in the download"
            cp ffmpeg-extract/*/LICENSE.txt out/Cindrix/LICENSES/ffmpeg-LICENSE.txt 2>/dev/null || true
            ./out/Cindrix/engines/ffmpeg.exe -hide_banner -encoders 2>&1 | grep -E "libopus| flac " || echo "::warning::this ffmpeg has no libopus; music will convert to FLAC"
          else
            echo "::warning::ffmpeg not downloaded; WMA music will not play in this build"
          fi
          printf 'Copy your music here (folders like Artist\\Album\\01 - Song.mp3). It is never changed or counted in the size limit.\r\n' > out/Cindrix/music/README.txt
          printf '{ "name": "Cindrix Ops", "edition": "go" }\r\n' > out/Cindrix/cindrix-drive.json
          printf 'Put .zim library files (from Kiwix) in this folder.\r\n' > out/Cindrix/library/README.txt
          if [ ! -f out/Cindrix/engines/llama-server.exe ]; then echo "::error::llama-server.exe missing: $(ls -R out/Cindrix/engines | tr '\n' ' ')"; exit 1; fi
          printf 'Put a Qwen3.5 .gguf model file in this folder (for example a 2B or 4B Q4 file).\r\n' > out/Cindrix/models/README.txt
          printf 'Run cindrix-ops.exe. Needs Microsoft WebView2 (already on Windows 11). Put a model file in the models folder.\r\n' > out/Cindrix/README.txt
      - name: Include the drive and map scripts (so a downloaded copy can fetch its own library and maps)
        shell: bash
        run: |
          mkdir -p out/Cindrix/scripts out/Cindrix/manifest
          cp scripts/build-drive.ps1 scripts/get-maps.ps1 out/Cindrix/scripts/
          cp manifest/content.json out/Cindrix/manifest/
      - name: Add a small test map (this also runs the real map download script)
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $work = Join-Path $env:RUNNER_TEMP 'mapwork'
          # A small area at zoom 0 to 13: a few MB, enough to see the map viewer draw roads, water and buildings.
          powershell -NoProfile -File scripts\get-maps.ps1 -Target $work -Bbox:'-105.10,39.62,-104.80,39.82' -Name test-area -MaxZoom 13
          if ($LASTEXITCODE -ne 0) { throw "get-maps.ps1 failed (exit $LASTEXITCODE)" }
          Copy-Item -Recurse -Force (Join-Path $work 'maps') 'out\Cindrix\maps'
          Get-ChildItem -Recurse 'out\Cindrix\maps' -File | ForEach-Object { Write-Host ("map file: {0} ({1:N1} MB)" -f $_.FullName, ($_.Length / 1MB)) }
      - uses: actions/upload-artifact@v4
        with:
          name: Cindrix-windows-portable
          path: out/Cindrix
