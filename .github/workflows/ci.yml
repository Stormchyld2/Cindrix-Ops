name: ci
on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests and safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core (includes tests/safety/dosing.json)
        working-directory: core
        run: cargo test --all-targets

  crypto:
    name: Passphrase lock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: crypto
        run: cargo test

  interface:
    name: Interface type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  windows:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri icon src-tauri/icon.svg
      - run: npx tauri build --no-bundle
      - name: Assemble portable folder
        shell: bash
        run: |
          mkdir -p out/Cindrix
          cp src-tauri/target/release/cindrix-ops.exe out/Cindrix/
          cp -r content out/Cindrix/content
          printf 'Run cindrix-ops.exe. Needs Microsoft WebView2 (already on Windows 11).\r\n' > out/Cindrix/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cindrix-windows-portable
          path: out/Cindrix
