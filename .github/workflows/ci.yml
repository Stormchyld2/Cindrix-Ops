name: ci
on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests and safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ffmpeg (the music tests make real audio files with it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test core (includes tests/safety/dosing.json)
        working-directory: core
        env:
          CINDRIX_REQUIRE_FFMPEG: "1"
        run: cargo test --all-targets

  crypto:
    name: Passphrase lock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: crypto
        run: cargo test

  interface:
    name: Interface type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Type check
        shell: bash
        run: |
          set +e
          npm run check > check.txt 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "Error|error" check.txt | head -15 | while IFS= read -r l; do echo "::error::${l}"; done
            tail -5 check.txt | while IFS= read -r l; do echo "::error::tail: ${l}"; done
          fi
          exit $code
      - run: npm run build

  screenshots:
    name: Screenshots of each screen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the built interface
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
      - run: node scripts/shots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Publish screenshots to the 'screenshots' branch
        if: github.ref == 'refs/heads/main'
        run: |
          cp -r shots "$RUNNER_TEMP/shots"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan screenshots
          git rm -rf --quiet .
          git clean -fdxq
          cp -r "$RUNNER_TEMP/shots/." .
          printf '# Screenshots\n\nMade by CI from the latest build of main.\n' > README.md
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f origin screenshots

  zim-check:
    name: Saved-website archive opens in real Kiwix tools
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build a sample archive with the website saver
        working-directory: core
        run: cargo run --example make_zim -- "$RUNNER_TEMP/zim"
      - name: Check it with zimcheck and kiwix-serve
        shell: bash
        run: |
          set +e
          fail=0
          say() { echo "::notice::$1"; }
          bad() { echo "::error::$1"; fail=1; }
          cd "$RUNNER_TEMP"
          curl -fsSL https://download.kiwix.org/release/kiwix-tools/ -o kt.html
          kt=$(grep -oE 'kiwix-tools_linux-x86_64-[0-9.]+\.tar\.gz' kt.html | sort -uV | tail -n1)
          sudo apt-get install -y zim-tools > apt.log 2>&1 || bad "apt could not install zim-tools"
          say "tools: $kt"
          [ -n "$kt" ] && curl -fsSL -o kt.tgz "https://download.kiwix.org/release/kiwix-tools/$kt" && mkdir -p kt && tar xzf kt.tgz -C kt --strip-components=1
          if command -v zimcheck > /dev/null; then
            out=$(zimcheck zim/sample.zim 2>&1); code=$?
            echo "::notice::zimcheck output: $(echo "$out" | grep -v INFO | tr '\n' '|' | head -c 1500)"
            [ $code -ne 0 ] && bad "zimcheck reported problems (exit $code)"
          else
            bad "zimcheck could not be downloaded"
          fi
          if [ -x kt/kiwix-serve ]; then
            kt/kiwix-serve --port 8099 --address 127.0.0.1 zim/sample.zim > serve.log 2>&1 &
            pid=$!
            sleep 4
            cat=$(curl -s "http://127.0.0.1:8099/catalog/v2/entries")
            path=$(echo "$cat" | grep -oE 'href="/content/[^"/]+"' | head -1 | sed -E 's/href="([^"]+)"/\1/')
            say "book path: $path"
            check() {
              code=$(curl -s -o body.txt -w '%{http_code}' "http://127.0.0.1:8099$1")
              if [ "$code" = "200" ] && grep -q "$2" body.txt; then say "ok $1"; else bad "FAILED $1 -> $code (wanted: $2)"; head -c 300 body.txt | while IFS= read -r l; do echo "::notice::$l"; done; fi
            }
            check "$path/example.test/index.html" "Boil water"
            check "$path/example.test/guides/water%20storage.html" "one gallon"
            check "$path/example.test/site.css" "background"
            check "$path/_cindrix/index.html" "All pages"
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099$path/example.test/pic.png")
            [ "$code" = "200" ] && say "ok picture" || bad "picture -> $code"
            sx=$(curl -s "http://127.0.0.1:8099/suggest?content=$(basename "$path")&term=water" | head -c 300)
            say "suggest: $sx"
            (cd "$GITHUB_WORKSPACE/core" && cargo run -q --example probe_kiwix -- 8099 "Boil water" 2>&1 | while IFS= read -r l; do echo "::notice::probe: $l"; done; exit ${PIPESTATUS[0]}) || bad "the in-app reader's assumptions do not hold against the real kiwix-serve"
            kill $pid 2>/dev/null
            head -20 serve.log | while IFS= read -r l; do echo "::notice::serve: $l"; done
          else
            bad "kiwix-serve could not be downloaded"
          fi
          exit $fail

  windows:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri icon src-tauri/icon.svg
      - run: npx tauri build --no-bundle
      - name: Assemble portable folder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trap 'echo "::error::failed at step line $LINENO"' ERR
          mkdir -p out/Cindrix
          cp src-tauri/target/release/cindrix-ops.exe out/Cindrix/
          cp -r content out/Cindrix/content
          mkdir -p out/Cindrix/models out/Cindrix/engines
          url=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=15" --jq '[.[].assets[] | select(.name | test("bin-win-cpu-x64\\.zip$"))][0].browser_download_url')
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "::error::no llama.cpp windows cpu asset found"; exit 1; fi
          echo "llama.cpp: $url"
          curl -fsSL -o llama.zip "$url"
          powershell -NoProfile -Command "Expand-Archive -Path llama.zip -DestinationPath llama-extract"
          ls llama-extract || true
          cp -r llama-extract/* out/Cindrix/engines/
          mkdir -p out/Cindrix/library
          curl -fsSL https://download.kiwix.org/release/kiwix-tools/ -o kt.html || true
          kt=$(grep -oE 'kiwix-tools_win-i686-[0-9.]+\.zip' kt.html | sort -uV | tail -n1 || true)
          if [ -n "$kt" ]; then
            echo "kiwix-tools: $kt"
            curl -fsSL -o kt.zip "https://download.kiwix.org/release/kiwix-tools/$kt"
            powershell -NoProfile -Command "Expand-Archive -Path kt.zip -DestinationPath kt-extract"
            cp -r kt-extract/*/* out/Cindrix/engines/ 2>/dev/null || cp -r kt-extract/* out/Cindrix/engines/
          else
            echo "::warning::kiwix-tools not found; the big library will not work in this build"
          fi
          # ffmpeg (LGPL build) lets the music player play WMA and similar. Optional: the build goes on without it.
          mkdir -p out/Cindrix/music out/Cindrix/LICENSES
          ff=$(gh api "repos/BtbN/FFmpeg-Builds/releases/latest" --jq '[.assets[] | select(.name | test("^ffmpeg-master-latest-win64-lgpl\\.zip$"))][0].browser_download_url' || true)
          if [ -n "$ff" ] && [ "$ff" != "null" ] && curl -fsSL -o ffmpeg.zip "$ff"; then
            powershell -NoProfile -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract"
            cp ffmpeg-extract/*/bin/ffmpeg.exe out/Cindrix/engines/ || echo "::warning::ffmpeg.exe not found in the download"
            cp ffmpeg-extract/*/LICENSE.txt out/Cindrix/LICENSES/ffmpeg-LICENSE.txt 2>/dev/null || true
            ./out/Cindrix/engines/ffmpeg.exe -hide_banner -encoders 2>&1 | grep -E "libopus| flac " || echo "::warning::this ffmpeg has no libopus; music will convert to FLAC"
          else
            echo "::warning::ffmpeg not downloaded; WMA music will not play in this build"
          fi
          printf 'Copy your music here (folders like Artist\\Album\\01 - Song.mp3). It is never changed or counted in the size limit.\r\n' > out/Cindrix/music/README.txt
          printf '{ "name": "Cindrix Ops", "edition": "go" }\r\n' > out/Cindrix/cindrix-drive.json
          printf 'Put .zim library files (from Kiwix) in this folder.\r\n' > out/Cindrix/library/README.txt
          if [ ! -f out/Cindrix/engines/llama-server.exe ]; then echo "::error::llama-server.exe missing: $(ls -R out/Cindrix/engines | tr '\n' ' ')"; exit 1; fi
          printf 'Put a Qwen3.5 .gguf model file in this folder (for example a 2B or 4B Q4 file).\r\n' > out/Cindrix/models/README.txt
          printf 'Run cindrix-ops.exe. Needs Microsoft WebView2 (already on Windows 11). Put a model file in the models folder.\r\n' > out/Cindrix/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cindrix-windows-portable
          path: out/Cindrix
