name: ci
on:
  push:
  pull_request:

jobs:
  core:
    name: Core tests and safety tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test core (includes tests/safety/dosing.json)
        working-directory: core
        run: cargo test --all-targets

  crypto:
    name: Passphrase lock tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: crypto
        run: cargo test

  interface:
    name: Interface type check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  screenshots:
    name: Screenshots of each screen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the built interface
        run: |
          npx vite preview --port 4173 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
      - run: node scripts/shots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
      - name: Publish screenshots to the 'screenshots' branch
        if: github.ref == 'refs/heads/main'
        run: |
          cp -r shots "$RUNNER_TEMP/shots"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan screenshots
          git rm -rf --quiet .
          cp -r "$RUNNER_TEMP/shots/." .
          printf '# Screenshots\n\nMade by CI from the latest build of main.\n' > README.md
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -f origin screenshots

  windows:
    name: Windows app build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri icon src-tauri/icon.svg
      - run: npx tauri build --no-bundle
      - name: Assemble portable folder
        shell: bash
        run: |
          mkdir -p out/Cindrix
          cp src-tauri/target/release/cindrix-ops.exe out/Cindrix/
          cp -r content out/Cindrix/content
          printf 'Run cindrix-ops.exe. Needs Microsoft WebView2 (already on Windows 11).\r\n' > out/Cindrix/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cindrix-windows-portable
          path: out/Cindrix
