[package]
name = "cindrix-crypto"
version = "0.1.0"
edition = "2021"
description = "Optional passphrase lock for the Family file: Argon2id + XChaCha20-Poly1305 (RustCrypto crates)."
license = "GPL-3.0-or-later"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
