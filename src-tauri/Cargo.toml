[package]
name = "cindrix-ops"
version = "0.1.0"
edition = "2021"
description = "Cindrix Ops desktop and Android app"
license = "GPL-3.0-or-later"

[lib]
name = "cindrix_ops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["gzip"] }
tauri-plugin-dialog = "2"
cindrix-core = { path = "../core" }
cindrix-crypto = { path = "../crypto" }
